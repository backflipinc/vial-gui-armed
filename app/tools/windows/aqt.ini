; aqt settings for this local test image: download.qt.io is not reachable from everywhere; the mirror carries
; .sha1 files next to the packages (not the .sha256 ones aqt asks qt.io for)
[aqt]
concurrency: 4
baseurl: https://mirror.yandex.ru/mirrors/qt.io

[mirrors]
trusted_mirrors:
    https://mirror.yandex.ru/mirrors/qt.io
fallbacks:
    https://mirrors.ocf.berkeley.edu/qt
    https://qt.mirror.constant.com

[requests]
connection_timeout: 30
response_timeout: 60
max_retries_on_connection_error: 5
max_retries_on_checksum_error: 3
max_retries_to_retrieve_hash: 5
hash_algorithm: sha1
