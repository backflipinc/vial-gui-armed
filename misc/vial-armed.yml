app: vial-armed

ingredients:
  dist: xenial
  sources:
    - deb http://archive.ubuntu.com/ubuntu/ xenial main universe
  package: vial-armed
  debs:
    - ../target/vial-armed.deb

script:
  - cat > ./AppRun <<\EOF
  - #!/bin/sh
  - HERE=$(dirname $(readlink -f "${0}"))
  - export QT_QPA_PLATFORM=xcb
  - exec "${HERE}/opt/vial-armed/vial-armed" "$@"
  - EOF
  - chmod a+x ./AppRun
  - cp usr/share/icons/hicolor/256x256/apps/vial-armed.png .
  - mv usr/share/applications/vial-armed.desktop .
  - sed -i -e 's@^Version=.*@Version=1.0@g' vial-armed.desktop
